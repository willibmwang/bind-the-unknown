# Run the chain on a genome somebody asked about, and publish the result.
#
# The request arrives as an issue created from .github/ISSUE_TEMPLATE/run-request.yml. The
# issue body is a stranger's text, so it is handed to a Python script through an environment
# variable and never interpolated into a `run:` block. See .github/scripts/run_request.py for
# why that distinction is the whole security model here.
#
# The chain calls public biology databases from a GitHub runner. One run at a time, by the
# concurrency group below, so a burst of issues queues instead of hammering NCBI in parallel.
name: Run the chain

on:
  issues:
    types: [opened, reopened, edited, labeled]
  workflow_dispatch:
    inputs:
      accession:
        description: NCBI nucleotide accession (comma-separate segments)
        required: true
      pathogen:
        description: What to call it
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: run-chain
  cancel-in-progress: false

jobs:
  run:
    # An issue qualifies when it was written on the run-request form, which is decided by
    # the form's own field heading rather than by a label. A new repository has no labels,
    # and GitHub silently drops a label an issue template asks for that does not exist yet,
    # so gating on one meant the first request anybody ever made was skipped. The label is
    # still honoured, and the job creates it below, but nothing depends on it being there.
    #
    # Reading the body in an `if:` is safe in a way that reading it in a `run:` is not: the
    # expression is evaluated by Actions and yields a boolean. It never reaches a shell.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.body, '### NCBI nucleotide accession') ||
      contains(github.event.issue.labels.*.name, 'run-request')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hpc_pilots/requirements.lock.txt

      - name: Install the pipeline
        run: pip install -r hpc_pilots/requirements.lock.txt

      - name: Acknowledge the request
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            // Adding a label that does not exist creates it, which is how the repository
            // acquires `run-request` without anyone opening the labels page.
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['run-request'],
              });
            } catch (error) {
              core.info(`could not label the issue: ${error.message}`);
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Running the chain. This takes a few minutes — the run is '
                  + `[here](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
                  + `/actions/runs/${context.runId}).`,
            });

      # The issue body goes in as an environment variable. It is never expanded by the shell.
      - name: Validate the request and run the chain
        id: chain
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_ACCESSION: ${{ github.event.inputs.accession }}
          INPUT_PATHOGEN: ${{ github.event.inputs.pathogen }}
        run: python3 .github/scripts/run_request.py

      - name: Rebuild the site
        if: steps.chain.outputs.ok == 'true'
        run: python3 output/build_site.py

      - name: Commit the record and its page
        if: steps.chain.outputs.ok == 'true'
        env:
          STEM: ${{ steps.chain.outputs.stem }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The record first: it is the result, and the page is generated from it. `runs/*`
          # is ignored with `!runs/onset_chain_*.json` negated, so this needs no force-add
          # and nothing else in runs/ can ride along.
          git add runs/ docs/
          if git diff --cached --quiet; then
            echo "nothing changed; the site already carries this run"
            exit 0
          fi
          # The accession is in an environment variable, quoted. It has already been matched
          # against a narrow pattern, and it is still not pasted into the command.
          git commit -m "Publish a run requested through the site: ${STEM}"
          git push

      - name: Report back
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.chain.outputs.ok }}
          PROBLEM: ${{ steps.chain.outputs.problem }}
          STEM: ${{ steps.chain.outputs.stem }}
          PATHOGEN: ${{ steps.chain.outputs.pathogen }}
          CHAINS: ${{ steps.chain.outputs.chains }}
          MEASURED: ${{ steps.chain.outputs.measured }}
          ROWS: ${{ steps.chain.outputs.rows }}
          SECONDS: ${{ steps.chain.outputs.seconds }}
        with:
          script: |
            const e = process.env;
            const owner = context.repo.owner, repo = context.repo.repo;
            let body;
            if (e.OK === 'true') {
              const url = `https://${owner}.github.io/${repo}/results/${e.STEM}.html`;
              body = [
                `**${e.PATHOGEN}** — done in ${e.SECONDS} s.`,
                '',
                `- ${e.CHAINS} chains ranked`,
                `- ${e.ROWS} surface rows for those ${e.CHAINS} chains, ${e.MEASURED} of them measured`,
                '- nothing dropped between stages',
                '',
                `Your page: ${url}`,
                '',
                'It may take a minute for Pages to publish. The raw record is beside the page,',
                `at \`results/${e.STEM}.json\`.`,
              ].join('\n');
            } else if (e.PROBLEM) {
              body = `That request was refused.\n\n> ${e.PROBLEM}\n\n`
                   + 'Edit the issue and re-apply the `run-request` label to try again.';
            } else {
              body = 'The run failed before it finished. The log is '
                   + `[here](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}).`
                   + '\n\nThis is usually a public database being slow or refusing a request '
                   + 'from a cloud runner, and is worth retrying.';
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number, body,
            });
