<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820"
     role="img" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
     aria-label="The environment holds the hidden truth. Three things never cross the boundary into the policy slot: the full outcome vector, the held-out replicate R3, and evidence dated after the decision. Each is pinned by a test that fails if it is breached. What does cross is observed labels, the dossier, the budget and the deadline, and back the other way one action. Any policy plugs into the same socket, and evaluation sits off the policy path so no metric returns to it.">
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>

  <rect width="1280" height="820" fill="#fcfcfb"/>

  <text x="48" y="48" font-size="25" font-weight="700" fill="#16191d">Where the model plugs in — and what it cannot see</text>
  <text x="48" y="78" font-size="14.5" fill="#5a6472">Isolation is structural, not disciplinary. Every blocked path is pinned by a test that fails if it is breached.</text>

  <line x1="520" y1="112" x2="520" y2="664" stroke="#16191d" stroke-width="2.5"/>
  <text x="520" y="104" font-size="12" font-weight="700" fill="#16191d" text-anchor="middle" letter-spacing="1.3">ISOLATION BOUNDARY</text>

  <!-- ENVIRONMENT -->
  <rect x="48" y="118" width="440" height="352" rx="7" fill="#f1f4f8" stroke="#c9d0d8" stroke-width="1.2"/>
  <text x="70" y="146" font-size="12" font-weight="700" fill="#5a6472" letter-spacing="1.2">ENVIRONMENT · HOLDS THE HIDDEN TRUTH</text>

  <g font-size="14.5" font-weight="600" fill="#16191d">
    <rect x="70" y="160" width="396" height="76" rx="5" fill="#fcfcfb" stroke="#c9d0d8" stroke-width="1.2"/>
    <text x="88" y="184">Full outcome vector</text>
    <text x="88" y="205" font-size="11" font-weight="400" fill="#5a6472">test — corrupt every unobserved label; the acquisitions</text>
    <text x="88" y="223" font-size="11" font-weight="400" fill="#5a6472">must still come out byte-identical</text>

    <rect x="70" y="250" width="396" height="76" rx="5" fill="#fcfcfb" stroke="#c9d0d8" stroke-width="1.2"/>
    <text x="88" y="274">Held-out MD replicate R3</text>
    <text x="88" y="295" font-size="11" font-weight="400" fill="#5a6472">test — set R3 to 1000; identical decision trace,</text>
    <text x="88" y="313" font-size="11" font-weight="400" fill="#5a6472">different measured error</text>

    <rect x="70" y="340" width="396" height="76" rx="5" fill="#fcfcfb" stroke="#c9d0d8" stroke-width="1.2"/>
    <text x="88" y="364">Evidence dated after <tspan font-style="italic">now</tspan></text>
    <text x="88" y="385" font-size="11" font-weight="400" fill="#5a6472">Dossier.observe refuses it — and records the refusal</text>
    <text x="88" y="403" font-size="11" font-weight="400" fill="#5a6472">rather than dropping it silently</text>
  </g>
  <text x="70" y="444" font-size="12.5" fill="#5a6472">11 targets · 3 families · 59 evidence entries, released on a schedule.</text>

  <!-- blocked crossings -->
  <g stroke="#c2410c" stroke-width="2.2">
    <line x1="470" y1="198" x2="505" y2="198"/>
    <line x1="470" y1="288" x2="505" y2="288"/>
    <line x1="470" y1="378" x2="505" y2="378"/>
  </g>
  <g stroke="#c2410c" stroke-width="3" stroke-linecap="round">
    <circle cx="520" cy="198" r="13" fill="#fcfcfb" stroke="#c2410c" stroke-width="2"/>
    <line x1="514" y1="192" x2="526" y2="204"/><line x1="526" y1="192" x2="514" y2="204"/>
    <circle cx="520" cy="288" r="13" fill="#fcfcfb" stroke="#c2410c" stroke-width="2"/>
    <line x1="514" y1="282" x2="526" y2="294"/><line x1="526" y1="282" x2="514" y2="294"/>
    <circle cx="520" cy="378" r="13" fill="#fcfcfb" stroke="#c2410c" stroke-width="2"/>
    <line x1="514" y1="372" x2="526" y2="384"/><line x1="526" y1="372" x2="514" y2="384"/>
  </g>
  <text x="548" y="186" font-size="13" font-weight="700" fill="#c2410c">never</text>
  <text x="548" y="204" font-size="13" font-weight="700" fill="#c2410c">crosses</text>

  <!-- POLICY SLOT -->
  <rect x="700" y="118" width="532" height="352" rx="7" fill="none" stroke="#2a78d6"
        stroke-width="2" stroke-dasharray="7 5"/>
  <text x="722" y="146" font-size="12" font-weight="700" fill="#2a78d6" letter-spacing="1.2">POLICY SLOT · ONE INTERFACE · INTERCHANGEABLE</text>

  <g font-size="15" fill="#16191d">
    <rect x="722" y="162" width="488" height="46" rx="5" fill="#fcfcfb" stroke="#c9d0d8" stroke-width="1.2"/>
    <text x="744" y="191">Fixed rubric</text>
    <rect x="722" y="218" width="488" height="46" rx="5" fill="#fcfcfb" stroke="#c9d0d8" stroke-width="1.2"/>
    <text x="744" y="247">LLM, in context</text>
    <rect x="722" y="274" width="488" height="46" rx="5" fill="#fcfcfb" stroke="#c9d0d8" stroke-width="1.2"/>
    <text x="744" y="303">Learned surrogate</text>
  </g>

  <text x="722" y="356" font-size="12.5" fill="#5a6472">Same seed, same surrogate, same eight initial observations — so the</text>
  <text x="722" y="376" font-size="12.5" fill="#5a6472">comparison is matched by construction rather than by care.</text>
  <text x="722" y="408" font-size="12.5" fill="#5a6472">Candidates are integer pool indices, so a variant cannot be recognised</text>
  <text x="722" y="428" font-size="12.5" fill="#5a6472">and its phenotype recalled. A mitigation — the weakest boundary here.</text>

  <!-- what does cross -->
  <text x="48" y="536" font-size="12" font-weight="700" fill="#2a78d6" letter-spacing="1.2">WHAT DOES CROSS</text>

  <text x="617" y="570" font-size="13.5" fill="#16191d" text-anchor="middle">observed labels · 7-axis dossier · remaining budget · deadline · allowed actions</text>
  <line x1="268" y1="584" x2="966" y2="584" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#blue)"/>

  <text x="617" y="622" font-size="13.5" fill="#16191d" text-anchor="middle">one action: buy evidence · rerank · recommend · stop</text>
  <line x1="966" y1="636" x2="268" y2="636" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#blue)"/>

  <!-- EVALUATION -->
  <rect x="48" y="686" width="1184" height="98" rx="7" fill="#f1f4f8" stroke="#c9d0d8" stroke-width="1.2"/>
  <text x="70" y="714" font-size="12" font-weight="700" fill="#5a6472" letter-spacing="1.2">EVALUATION · OFF THE POLICY PATH</text>
  <text x="70" y="742" font-size="13.5" fill="#16191d">Scores the action against the truth the policy never saw, and reports what it cost beside it.</text>
  <text x="70" y="766" font-size="12.5" fill="#c2410c">No arrow returns — a policy cannot read a metric it has not earned.</text>

  <line x1="1120" y1="686" x2="1120" y2="500" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="6 5"/>
  <circle cx="1120" cy="492" r="13" fill="#fcfcfb" stroke="#c2410c" stroke-width="2"/>
  <g stroke="#c2410c" stroke-width="3" stroke-linecap="round">
    <line x1="1114" y1="486" x2="1126" y2="498"/><line x1="1126" y1="486" x2="1114" y2="498"/>
  </g>
  <text x="1140" y="600" font-size="12.5" font-weight="700" fill="#c2410c">scores</text>
</svg>
